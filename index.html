<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Course Pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="wrap">
 
  <header>
    <p class="eyebrow">PROGRAMMING COURSES</p>
    <h1>Choose Your Course</h1>
    <p class="subtitle">Simple pricing. Real projects. Pick the course that's right for you.</p>
  </header>
 
  <div class="cards" id="cards"></div>
 
</div>
 
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">&#10003;</div>
    <h2>Course Selected!</h2>
    <p id="modalText">Your course has been selected successfully!</p>
    <p class="confetti">🎉</p>
    <button class="modal-cta" id="modalClose">Continue</button>
  </div>
</div>
 
<script src="script.js"></script>
</body>
</html>
